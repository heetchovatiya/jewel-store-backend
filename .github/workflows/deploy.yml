name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            cd ~/jewel-store/backend
            git pull origin main
            npm install --production
            npm run build
            # Full recreate so process env is rebuilt (pm2 restart does not reload env)
            pm2 delete jewel-api || true
            # Export .env into the shell so PM2 captures CDN_* into the process env
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            pm2 start npm --name jewel-api --cwd "$(pwd)" --update-env -- run start
            pm2 save
            echo "=== PM2 CDN env ==="
            pm2 env 0 | grep -iE 'CDN|R2_PUBLIC' || echo "(not in pm2 env — Nest may still load via ConfigModule from .env)"
            
      - name: Send Email - Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Jewel Store Backend - Deployment Successful"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            🚀 Backend Deployment Successful!
            
            📦 Repository: ${{ github.repository }}
            🔗 Commit: ${{ github.sha }}
            👤 Deployed by: ${{ github.actor }}
            ⏰ Time: ${{ github.event.head_commit.timestamp }}
            
            View commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            
      - name: Send Email - Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Jewel Store Backend - Deployment Failed"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            ⚠️ Backend Deployment Failed!
            
            📦 Repository: ${{ github.repository }}
            🔗 Commit: ${{ github.sha }}
            👤 Triggered by: ${{ github.actor }}
            
            🔍 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
